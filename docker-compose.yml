services:
  db:
    image: postgres:17
    container_name: legacy_db
    environment:
      POSTGRES_DB: legacy_payments
      POSTGRES_USER: legacy_user
      POSTGRES_PASSWORD: legacy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seeder.sql:/docker-entrypoint-initdb.d/02-seeder.sql:ro

  fsharp:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: legacy_fsharp
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db

volumes:
  postgres_data: